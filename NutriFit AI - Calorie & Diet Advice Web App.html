<body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-brand-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- JSON CLEANING HELPER ---
        function cleanJsonFences(text) {
            if (!text) return "";
            let cleaned = text.trim();
            if (cleaned.startsWith("```json")) {
                cleaned = cleaned.replace(/^```json\s*/, "").replace(/\s*```$/, "");
            } else if (cleaned.startsWith("```")) {
                cleaned = cleaned.replace(/^```\s*/, "").replace(/\s*```$/, "");
            }
            return cleaned;
        }

        // --- MARKDOWN TO HTML RENDERER ---
        function renderMarkdownToHtml(text) {
            if (!text) return "";
            let html = String(text).trim();

            // Normalize line endings
            html = html.replace(/\r\n/g, '\n');

            // Escape HTML entities first to prevent XSS
            html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            // Code blocks (``` ... ```)
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });

            // Tables: detect lines containing |
            html = html.replace(/((?:^\|.+\|$\n?)+)/gm, (tableBlock) => {
                const rows = tableBlock.trim().split('\n').filter(r => r.trim());
                if (rows.length < 2) return tableBlock;

                const isSeparator = (row) => /^\|[\s\-:]+(\|[\s\-:]+)*\|?$/.test(row.trim());
                let headerRow = null;
                let dataRows = [];
                let sepIdx = -1;

                for (let i = 0; i < rows.length; i++) {
                    if (isSeparator(rows[i])) { sepIdx = i; break; }
                }

                if (sepIdx > 0) {
                    headerRow = rows[0];
                    dataRows = rows.slice(sepIdx + 1);
                } else if (sepIdx === 1) {
                    headerRow = rows[0];
                    dataRows = rows.slice(2);
                } else {
                    dataRows = rows;
                }

                const parseRow = (row) => {
                    return row.split('|').filter((c, i, arr) => i > 0 && i < arr.length - 1).map(c => c.trim());
                };

                let tableHtml = '<table>';
                if (headerRow) {
                    const cells = parseRow(headerRow);
                    tableHtml += '<thead><tr>' + cells.map(c => `<th>${renderInlineMarkdown(c)}</th>`).join('') + '</tr></thead>';
                }
                tableHtml += '<tbody>';
                for (const row of dataRows) {
                    const cells = parseRow(row);
                    tableHtml += '<tr>' + cells.map(c => `<td>${renderInlineMarkdown(c)}</td>`).join('') + '</tr>';
                }
                tableHtml += '</tbody></table>';
                return tableHtml;
            });

            // Horizontal rules (--- or *** or ___)
            html = html.replace(/^[\t ]*[-*_]{3,}[\t ]*$/gm, '<hr>');

            // Headings (#### > ### > ## > #) - call renderInlineMarkdown on content to strip/parse asterisks
            html = html.replace(/^######\s*(.+)$/gm, (m, c) => `<h6>${cleanMarkdownHeading(c)}</h6>`);
            html = html.replace(/^#####\s*(.+)$/gm, (m, c) => `<h5>${cleanMarkdownHeading(c)}</h5>`);
            html = html.replace(/^####\s*(.+)$/gm, (m, c) => `<h4>${cleanMarkdownHeading(c)}</h4>`);
            html = html.replace(/^###\s*(.+)$/gm, (m, c) => `<h3>${cleanMarkdownHeading(c)}</h3>`);
            html = html.replace(/^##\s*(.+)$/gm, (m, c) => `<h2>${cleanMarkdownHeading(c)}</h2>`);
            html = html.replace(/^#\s*(.+)$/gm, (m, c) => `<h1>${cleanMarkdownHeading(c)}</h1>`);

            // Blockquotes (&gt; or >)
            html = html.replace(/^(?:&gt;|>)\s*(.+)$/gm, (m, c) => `<blockquote>${renderInlineMarkdown(c)}</blockquote>`);

            // Unordered lists (* or - or • items)
            html = html.replace(/((?:^[\t ]*[*•\-]\s+.+$\n?)+)/gm, (block) => {
                const items = block.trim().split('\n');
                let listHtml = '<ul>';
                for (const item of items) {
                    const content = item.replace(/^[\t ]*[*•\-]\s+/, '');
                    listHtml += `<li>${renderInlineMarkdown(content)}</li>`;
                }
                listHtml += '</ul>';
                return listHtml;
            });

            // Ordered lists (1. 2. 3. items)
            html = html.replace(/((?:^\d+[\.\)]\s+.+$\n?)+)/gm, (block) => {
                const items = block.trim().split('\n');
                let listHtml = '<ol>';
                for (const item of items) {
                    const content = item.replace(/^\d+[\.\)]\s+/, '');
                    listHtml += `<li>${renderInlineMarkdown(content)}</li>`;
                }
                listHtml += '</ol>';
                return listHtml;
            });

            // Apply inline markdown to remaining text line-by-line
            html = html.split('\n').map(line => {
                const trimmed = line.trim();
                if (!trimmed) return '';
                // Skip lines already converted to block HTML tags
                if (/^<(h[1-6]|ul|ol|li|table|thead|tbody|tr|td|th|hr|blockquote|pre|div)/i.test(trimmed)) {
                    return line;
                }
                // Strip leftover stray leading markdown markers if any
                let cleanLine = trimmed.replace(/^#{1,6}\s*/, '').replace(/^[*•\-]\s*/, '');
                return `<p>${renderInlineMarkdown(cleanLine)}</p>`;
            }).join('\n');

            // Clean up empty paragraphs and excessive linebreaks
            html = html.replace(/<p>\s*<\/p>/g, '');
            html = html.replace(/\n{3,}/g, '\n\n');

            return html;
        }

        // Clean up markdown asterisks or hashes inside heading strings
        function cleanMarkdownHeading(text) {
            if (!text) return "";
            let cleaned = text.trim();
            // Remove wrapping bold asterisks if the whole heading was **Heading**
            if (cleaned.startsWith("**") && cleaned.endsWith("**") && cleaned.length > 4) {
                cleaned = cleaned.slice(2, -2).trim();
            }
            return renderInlineMarkdown(cleaned);
        }

        // Render inline markdown: bold, italic, inline code, links, strikethrough
        function renderInlineMarkdown(text) {
            if (!text) return "";
            let result = String(text);

            // Inline code `code`
            result = result.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Bold + italic ***text*** or ___text___
            result = result.replace(/(\*\*\*|___)(.*?)\1/g, '<strong><em>$2</em></strong>');
            // Bold **text** or __text__
            result = result.replace(/(\*\*|__)(.*?)\1/g, '<strong>$2</strong>');
            // Italic *text* or _text_
            result = result.replace(/(\*|_)(.*?)\1/g, '<em>$2</em>');
            // Strikethrough ~~text~~
            result = result.replace(/~~(.*?)~~/g, '<del>$1</del>');
            // Links [text](url)
            result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="text-brand-600 font-semibold underline hover:text-brand-700">$1</a>');

            // Final safety pass to clean up any leftover escaped markdown symbols
            result = result.replace(/\\\*/g, '*').replace(/\\#/g, '#');

            return result;
        }

        // React component for rendered markdown
        function RenderedMarkdown({ text, className = "" }) {
            const html = useMemo(() => renderMarkdownToHtml(text), [text]);
            return React.createElement('div', {
                className: `md-render ${className}`,
                dangerouslySetInnerHTML: { __html: html }
            });
        }

        // --- GEMINI API ENGINE ---
        async function fetchGeminiAdvice(prompt, systemInstruction = "", responseSchema = null, customKey = null) {
            const savedKey = localStorage.getItem('nutrifit_gemini_api_key') || "";
            const apiKey = customKey || savedKey;

            if (!apiKey || !apiKey.trim()) {
                throw new Error("NO_API_KEY");
            }

            // Fallback endpoints in priority order
            const models = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.1-pro-preview"];
            let lastError = null;

            for (const model of models) {
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                };

                if (systemInstruction) {
                    payload.systemInstruction = {
                        parts: [{ text: systemInstruction }]
                    };
                }

                if (responseSchema) {
                    payload.generationConfig = {
                        responseMimeType: "application/json",
                        responseSchema: responseSchema
                    };
                }

                try {
                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) {
                        const errData = await res.json().catch(() => ({}));
                        const errMsg = errData.error?.message || `HTTP ${res.status}`;
                        
                        if (res.status === 400 && (errMsg.toLowerCase().includes('key') || errMsg.toLowerCase().includes('invalid'))) {
                            throw new Error("INVALID_API_KEY");
                        }
                        if (res.status === 429) {
                            throw new Error("QUOTA_EXCEEDED");
                        }
                        if (res.status === 404) {
                            lastError = new Error(errMsg);
                            continue; // Try next model
                        }
                        throw new Error(errMsg);
                    }

                    const data = await res.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!text) throw new Error("Received empty response from Gemini API.");
                    return text;
                } catch (err) {
                    if (err.message === "NO_API_KEY" || err.message === "INVALID_API_KEY" || err.message === "QUOTA_EXCEEDED") {
                        throw err;
                    }
                    lastError = err;
                }
            }

            throw lastError || new Error("Failed to connect to Gemini API models.");
        }

        // --- HELPER CALCULATIONS (Mifflin-St Jeor) ---
        function calculateNutrition(profile) {
            let { gender, age, heightCm, weightKg, activityLevel, goal, pace, dietType } = profile;
            
            // BMR using Mifflin-St Jeor Equation
            let bmr = 0;
            if (gender === 'male') {
                bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) + 5;
            } else {
                bmr = (10 * weightKg) + (6.25 * heightCm) - (5 * age) - 161;
            }

            // Activity Multiplier
            const activityMultipliers = {
                sedentary: 1.2,      // Desk job, minimal exercise
                light: 1.375,        // Light exercise 1-3 days/wk
                moderate: 1.55,      // Moderate exercise 3-5 days/wk
                active: 1.725,       // Hard exercise 6-7 days/wk
                very_active: 1.9    // Intense physical job or training
            };

            const tdee = Math.round(bmr * (activityMultipliers[activityLevel] || 1.2));

            // Goal Adjustment
            let goalAdjustment = 0;
            if (goal === 'lose') {
                if (pace === 'mild') goalAdjustment = -250;
                else if (pace === 'fast') goalAdjustment = -750;
                else goalAdjustment = -500; // standard 0.5kg/week
            } else if (goal === 'gain') {
                if (pace === 'mild') goalAdjustment = +250;
                else if (pace === 'fast') goalAdjustment = +500;
                else goalAdjustment = +350;
            }

            let targetCalories = Math.max(1200, Math.round(tdee + goalAdjustment));

            // Macros calculation according to Diet Preference
            let proteinPct = 0.30, carbPct = 0.40, fatPct = 0.30;
            if (dietType === 'high_protein') {
                proteinPct = 0.40; carbPct = 0.35; fatPct = 0.25;
            } else if (dietType === 'low_carb') {
                proteinPct = 0.35; carbPct = 0.20; fatPct = 0.45;
            } else if (dietType === 'keto') {
                proteinPct = 0.25; carbPct = 0.05; fatPct = 0.70;
            } else if (dietType === 'vegan' || dietType === 'vegetarian' || dietType === 'indian_veg') {
                proteinPct = 0.25; carbPct = 0.50; fatPct = 0.25;
            } else if (dietType === 'mediterranean') {
                proteinPct = 0.25; carbPct = 0.45; fatPct = 0.30;
            }

            const proteinGrams = Math.round((targetCalories * proteinPct) / 4);
            const carbGrams = Math.round((targetCalories * carbPct) / 4);
            const fatGrams = Math.round((targetCalories * fatPct) / 9);

            // Water intake recommendation (Liters)
            const waterLiters = ((weightKg * 0.033) + (activityLevel === 'active' || activityLevel === 'very_active' ? 0.6 : 0.3)).toFixed(1);

            // BMI Calculation
            const heightM = heightCm / 100;
            const bmi = parseFloat((weightKg / (heightM * heightM)).toFixed(1));
            
            let bmiCategory = "Normal weight";
            let bmiColor = "text-emerald-600 bg-emerald-50 border-emerald-200";
            if (bmi < 18.5) { bmiCategory = "Underweight"; bmiColor = "text-amber-600 bg-amber-50 border-amber-200"; }
            else if (bmi >= 25 && bmi < 29.9) { bmiCategory = "Overweight"; bmiColor = "text-orange-600 bg-orange-50 border-orange-200"; }
            else if (bmi >= 30) { bmiCategory = "Obese"; bmiColor = "text-red-600 bg-red-50 border-red-200"; }

            // Ideal Weight Range (BMI 18.5 - 24.9)
            const idealWeightMin = Math.round(18.5 * heightM * heightM);
            const idealWeightMax = Math.round(24.9 * heightM * heightM);

            return {
                bmr,
                tdee,
                targetCalories,
                macros: { proteinGrams, carbGrams, fatGrams },
                waterLiters,
                bmi,
                bmiCategory,
                bmiColor,
                idealWeightMin,

            };

            const [isSendingMessage, setIsSendingMessage] = useState(false);

                if (!chatInput.trim() || isSendingMessage) return;

                const userText = chatInput;
                setChatInput("");

                const newHistory = [...chatMessages, { sender: 'user', text: userText }];
                setChatMessages(newHistory);
                setIsSendingMessage(true);

                    The user has a profile:
                    - Weight: ${profile.weightKg} kg, Goal: ${profile.goal} weight (${profile.targetWeightKg} kg)
                    - Target Calories: ${nutrition.targetCalories} kcal/day
                    - Protein: ${nutrition.macros.proteinGrams}g, Carbs: ${nutrition.macros.carbGrams}g, Fats: ${nutrition.macros.fatGrams}g
                    - Diet Preference: ${profile.dietType}

                    User question: "${userText}"

                    Provide a concise, highly practical, and helpful dietitian answer.
                `;

                    const reply = await fetchGeminiAdvice(prompt, "You are an expert sports nutritionist and friendly health coach.");
                    setChatMessages([...newHistory, { sender: 'ai', text: reply }]);
                } catch (e) {
                    handleApiError(e);
                    setChatMessages([...newHistory, { sender: 'ai', text: "Sorry, I had trouble answering that right now. Please check your Gemini API connection." }]);
                } finally {
                    setIsSendingMessage(false);

                        <div className="flex flex-wrap gap-3">

        function FoodTrackerTab({

            const [calories, setCalories] = useState("");
            const [protein, setProtein] = useState("");

            // AI Natural Language Parser
            const [aiMealText, setAiMealText] = useState("");
            const [isParsingMeal, setIsParsingMeal] = useState(false);

            const handleAddFood = (e) => {
                e?.preventDefault();
                if (!foodName || !calories) {
                    showToast("Please enter food name and calories.", "warning");
                    return;

                const todayStr = new Date().toISOString().split('T')[0];
                const newItem = {
                    id: Date.now(),
                    date: todayStr,
                    category: activeMealCategory,
                    name: foodName,
                    calories: Number(calories),
                    protein: Number(protein || 0),
                    carbs: Number(carbs || 0),
                    fat: Number(fat || 0)
                };

                setFoodLogs(prev => [newItem, ...prev]);
                setFoodName("");
                setCalories("");
                setProtein("");
                setCarbs("");
                setFat("");
                showToast(`Added ${newItem.name} to ${activeMealCategory}`, "success");
            };

            const handleDeleteFood = (id) => {
                setFoodLogs(prev => prev.filter(item => item.id !== id));
                showToast("Item removed.");

            // AI Natural Language Meal Parser
            const handleParseMealWithAi = async () => {
                if (!aiMealText.trim()) return;
                setIsParsingMeal(true);

                const prompt = `
                    Parse this food description and estimate the total calories, protein (g), carbs (g), and fat (g):
                    Food description: "${aiMealText}"
                `;

                const schema = {
                    type: "OBJECT",
                    properties: {
                        foodName: { type: "STRING" },
                        calories: { type: "NUMBER" },
                        protein: { type: "NUMBER" },
                        carbs: { type: "NUMBER" },
                        fat: { type: "NUMBER" }
                    },
                    required: ["foodName", "calories", "protein", "carbs", "fat"]
                };

                try {
                    const resText = await fetchGeminiAdvice(prompt, "You are a food database calorie estimation tool.", schema);
                    const parsed = JSON.parse(cleanJsonFences(resText));
                    
                    setFoodName(parsed.foodName || aiMealText);
                    setCalories(parsed.calories);
                    setProtein(parsed.protein);
                    setCarbs(parsed.carbs);
                    setFat(parsed.fat);
                    setAiMealText("");
                    showToast("AI estimated macros! Click 'Add Meal Entry' to save.", "success");

                    handleApiError(e);
                } finally {
                    setIsParsingMeal(false);

            const calPct = Math.min(100, Math.round((consumedTotals.calories / nutrition.targetCalories) * 100));

                                    -
                                </button>
                                <span className="text-xs font-bold text-sky-600 px-1">{waterIntake.toFixed(2)} L</span>
                                <button
                                    onClick={() => setWaterIntake(w => w + 0.25)}
                                    className="w-7 h-7 bg-sky-500 text-white rounded-lg font-bold hover:bg-sky-600 shadow-sm"
                                >
                                    +
                                </button>
                            </div>

                        {/* Progress Bar */}
                        <div className="space-y-4">

                                <div className="flex justify-between items-center text-sm font-bold mb-2">

                                    </span>
                                </div>
                                <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden p-0.5 border border-slate-200">
                                    <div
                                        className={`h-full rounded-full transition-all duration-500 ${
                                            consumedTotals.calories > nutrition.targetCalories ? 'bg-red-500' : 'bg-gradient-to-r from-brand-500 to-emerald-400'
                                        }`}
                                        style={{ width: `${calPct}%` }}
                                    ></div>
                                </div>
                            </div>

                            {/* Macro Target Cards */}

                                        <span className="text-emerald-700">Protein</span>

                                {/* Carbs */}

                                        <span className="text-slate-800">{consumedTotals.carbs} / {nutrition.macros.carbGrams}g</span>
                                    </div>
                                    <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                        <div className="bg-amber-500 h-full rounded-full" style={{ width: `${Math.min(100, (consumedTotals.carbs / nutrition.macros.carbGrams) * 100)}%` }}></div>
                                    </div>

                                        <span className="text-rose-700">Fats</span>
                                        <span className="text-slate-800">{consumedTotals.fat} / {nutrition.macros.fatGrams}g</span>
                                    </div>
                                    <div className="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                        <div className="bg-rose-500 h-full rounded-full" style={{ width: `${Math.min(100, (consumedTotals.fat / nutrition.macros.fatGrams) * 100)}%` }}></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Meal Input Form Column */}
                        <div className="lg:col-span-5 bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                            <h3 className="text-base font-bold text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2">
                                <i className="fa-solid fa-plus-circle text-brand-600"></i>
                                Log a Meal or Food Item
                            </h3>

                            {/* AI Natural Language Fast Assistant */}
                            <div className="bg-gradient-to-r from-brand-50 to-emerald-50 p-4 rounded-xl border border-brand-200 space-y-3">
                                <label className="block text-xs font-bold text-brand-900 uppercase tracking-wider flex items-center gap-1.5">
                                    <i className="fa-solid fa-wand-magic-sparkles text-brand-600"></i>
                                    AI Fast Food Parser
                                </label>
                                <p className="text-xs text-slate-600">Type what you ate (e.g. "2 boiled eggs with 2 whole wheat toasts") and Gemini will estimate macros!</p>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        placeholder="Describe your food..."
                                        value={aiMealText}
                                        onChange={(e) => setAiMealText(e.target.value)}
                                        className="flex-1 px-3 py-2 bg-white border border-brand-200 rounded-lg text-xs focus:ring-2 focus:ring-brand-500"
                                    />
                                    <button
                                        type="button"
                                        onClick={handleParseMealWithAi}
                                        disabled={isParsingMeal || !aiMealText.trim()}
                                        className="px-3 py-2 bg-brand-600 text-white rounded-lg text-xs font-semibold shadow hover:bg-brand-700 disabled:opacity-50"
                                    >
                                        {isParsingMeal ? <i className="fa-solid fa-spinner fa-spin"></i> : "Parse"}
                                    </button>
                                </div>
                            </div>

                            {/* Meal Category Selector */}
                            <div>
                                <label className="block text-xs font-semibold text-slate-700 mb-2 uppercase tracking-wider">Meal Category</label>
                                <div className="grid grid-cols-4 gap-1.5 bg-slate-100 p-1 rounded-xl">
                                    {["Breakfast", "Lunch", "Dinner", "Snack"].map((cat) => (
                                        <button
                                            key={cat}
                                            type="button"
                                            onClick={() => setActiveMealCategory(cat)}
                                            className={`py-2 text-xs font-bold rounded-lg transition-all ${
                                                activeMealCategory === cat
                                                    ? 'bg-white text-slate-900 shadow-sm'
                                                    : 'text-slate-500 hover:text-slate-900'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Standard Manual Inputs */}
                            <form onSubmit={handleAddFood} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Food / Dish Name</label>
                                    <input
                                        type="text"
                                        placeholder="e.g., Grilled Chicken Salad"
                                        value={foodName}
                                        onChange={(e) => setFoodName(e.target.value)}
                                        className="w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-brand-500"
                                    />
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Calories</label>
                                        <input
                                            type="number"
                                            placeholder="kcal"
                                            value={calories}
                                            onChange={(e) => setCalories(e.target.value)}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-brand-500 font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Protein (g)</label>
                                        <input
                                            type="number"
                                            placeholder="g"
                                            value={protein}
                                            onChange={(e) => setProtein(e.target.value)}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-brand-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Carbs (g)</label>
                                        <input
                                            type="number"
                                            placeholder="g"
                                            value={carbs}
                                            onChange={(e) => setCarbs(e.target.value)}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-brand-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Fat (g)</label>
                                        <input
                                            type="number"
                                            placeholder="g"
                                            value={fat}
                                            onChange={(e) => setFat(e.target.value)}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-xs focus:ring-2 focus:ring-brand-500"
                                        />
                                    </div>

                                <button
                                    type="submit"
                                    className="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl text-sm transition-all shadow-md"

                                <span>Logged Meals for Today</span>
                                <span className="text-xs font-normal text-slate-500">{todaysLogs.length} items</span>
                            </h3>

                            {todaysLogs.length === 0 ? (

                                    <p className="text-xs mt-1">Use the form or AI Fast Parser to start tracking!</p>

                                        <div key={item.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 flex justify-between items-center">
                                            <div>

                                                    <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-brand-100 text-brand-800">
                                                        {item.category}
                                                    </span>
                                                    <h4 className="font-bold text-slate-900 text-sm">{item.name}</h4>
                                                </div>
                                                <div className="text-xs text-slate-500 mt-1 space-x-3">
                                                    <span>Protein: <strong className="text-slate-700">{item.protein}g</strong></span>
                                                    <span>Carbs: <strong className="text-slate-700">{item.carbs}g</strong></span>
                                                    <span>Fat: <strong className="text-slate-700">{item.fat}g</strong></span>

                                            <div className="flex items-center gap-4">
                                                <span className="font-extrabold text-slate-900 text-sm">{item.calories} <span className="text-xs font-normal text-slate-500">kcal</span></span>

                                                    title="Delete item"
                                                >
                                                    <i className="fa-solid fa-trash-can text-sm"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function ProgressTab({ profile, setProfile, nutrition, weightHistory, setWeightHistory, showToast }) {
            const [newWeight, setNewWeight] = useState("");
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Add Weight Entry
            const handleAddWeight = (e) => {
                e?.preventDefault();
                if (!newWeight) return;

                const todayStr = new Date().toISOString().split('T')[0];
                const updated = [...weightHistory, { date: todayStr, weight: Number(newWeight) }];
                setWeightHistory(updated);
                setProfile(p => ({ ...p, weightKg: Number(newWeight) }));
                setNewWeight("");
                showToast("Weight history updated!", "success");
            };

            // Render Chart.js
            useEffect(() => {
                if (!chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: weightHistory.map(h => h.date),
                        datasets: [
                            {
                                label: 'Body Weight (kg)',
                                data: weightHistory.map(h => h.weight),
                                borderColor: '#16a34a',
                                backgroundColor: 'rgba(22, 163, 74, 0.1)',
                                fill: true,
                                tension: 0.3,
                                pointRadius: 5,
                                pointBackgroundColor: '#16a34a'
                            },
                            {
                                label: 'Target Weight Goal',
                                data: weightHistory.map(() => profile.targetWeightKg),
                                borderColor: '#94a3b8',
                                borderDash: [6, 6],
                                fill: false,
                                pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top' }
                        },
                        scales: {
                            y: {
                                title: { display: true, text: 'Weight (kg)' }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [weightHistory, profile.targetWeightKg]);

            const weightDiff = (profile.weightKg - profile.targetWeightKg).toFixed(1);

            return (
                <div className="space-y-8">
                    {/* Header Summary */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="text-xs text-slate-400 block font-semibold uppercase tracking-wider">Current Weight</span>
                            <span className="text-3xl font-black text-slate-900 mt-1 block">{profile.weightKg} kg</span>
                            <span className="text-xs text-emerald-600 font-semibold mt-1 block">BMI: {nutrition.bmi}</span>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="text-xs text-slate-400 block font-semibold uppercase tracking-wider">Target Weight</span>
                            <span className="text-3xl font-black text-brand-700 mt-1 block">{profile.targetWeightKg} kg</span>
                            <span className="text-xs text-slate-500 mt-1 block">
                                {Number(weightDiff) > 0 ? `${weightDiff} kg remaining to lose` : Number(weightDiff) < 0 ? `${Math.abs(weightDiff)} kg remaining to gain` : 'Goal achieved!'}
                            </span>
                        </div>

                        <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm text-center">
                            <span className="text-xs text-slate-400 block font-semibold uppercase tracking-wider">Healthy Range</span>
                            <span className="text-3xl font-black text-slate-800 mt-1 block">{nutrition.idealWeightMin} - {nutrition.idealWeightMax} kg</span>
                            <span className="text-xs text-slate-500 mt-1 block">Based on WHO BMI guidelines</span>
                        </div>
                    </div>

                    {/* Chart Card */}
                    <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-100 pb-4">
                            <div>
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <i className="fa-solid fa-chart-line text-brand-600"></i>
                                    Weight Progress Over Time
                                </h3>
                                <p className="text-xs text-slate-500">Track your weigh-ins against your target goal trajectory</p>
                            </div>

                            {/* Add weigh-in form */}
                            <form onSubmit={handleAddWeight} className="flex gap-2">
                                <input
                                    type="number"
                                    step="0.1"
                                    placeholder="Log weight (kg)"
                                    value={newWeight}
                                    onChange={(e) => setNewWeight(e.target.value)}
                                    className="px-3 py-2 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-brand-500"
                                />
                                <button
                                    type="submit"
                                    className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700 transition-colors"
                                >
                                    Log Weight
                                </button>
                            </form>
                        </div>

                        {/* Canvas container */}
                        <div className="h-72 w-full">
                            <canvas ref={chartRef}></canvas>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
